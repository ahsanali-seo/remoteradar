[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahsan-remoteradar"
version = "1.0.0"
description = "Automated remote SEO job agent for Lahore and Islamabad companies"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "anthropic>=0.40",
  "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "python-dotenv>=1.0",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["static/*"]
